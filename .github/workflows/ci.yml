name: tests
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.6'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked pytest
